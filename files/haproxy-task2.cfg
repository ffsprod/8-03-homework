#---------------------------------------------------------------------
# Weighted Round Robin на 7 уровне (L7 / mode http)
#---------------------------------------------------------------------
global
    log /dev/log local0
    log /dev/log local1 notice
    chroot /var/lib/haproxy
    stats socket /run/haproxy/admin.sock mode 660 level admin
    stats timeout 30s
    user haproxy
    group haproxy
    daemon
    maxconn 2048

defaults
    log     global
    mode    http
    option  httplog
    timeout connect 5s
    timeout client  50s
    timeout server  50s

frontend homework_l7
    bind :80
    mode http

    acl is_example hdr(host) -i example.local
    use_backend web_servers if is_example

    default_backend no_domain

backend web_servers
    mode http
    balance roundrobin
    server srv1 127.0.0.1:8081 weight 2 check
    server srv2 127.0.0.1:8082 weight 3 check
    server srv3 127.0.0.1:8083 weight 4 check

backend no_domain
    mode http
    http-request deny deny_status 403

#---------------------------------------------------------------------
# Страница статистики
#---------------------------------------------------------------------
listen stats
    bind :8404
    mode http
    stats enable
    stats uri /stats
    stats refresh 5s
