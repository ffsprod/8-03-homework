#---------------------------------------------------------------------
# балансировка Round-robin на 4 уровне
# Файл: /etc/haproxy/haproxy.cfg
#---------------------------------------------------------------------
global
    log /dev/log local0
    log /dev/log local1 notice
    chroot /var/lib/haproxy
    stats socket /run/haproxy/admin.sock mode 660 level admin
    stats timeout 30s
    user haproxy
    group haproxy
    daemon
    maxconn 2048

defaults
    log     global
    timeout connect 5s
    timeout client  50s
    timeout server  50s

#---------------------------------------------------------------------
# L4-балансировка
#---------------------------------------------------------------------
listen homework_l4
    bind :80
    mode tcp
    balance roundrobin
    server srv1 127.0.0.1:8081 check
    server srv2 127.0.0.1:8082 check

#---------------------------------------------------------------------
# Страница статистики
#---------------------------------------------------------------------
listen stats
    bind :8404
    mode http
    stats enable
    stats uri /stats
    stats refresh 5s
